name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest tests/test_collector.py -q
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t attest-proxy:ci .
      - run: docker build -f Dockerfile.collector -t gpu-evidence-collector:ci .
      - run: docker build -f Dockerfile.measurer -t model-measurer:ci .
