name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t attest-proxy:ci .
      - run: docker build -f Dockerfile.collector -t gpu-evidence-collector:ci .
