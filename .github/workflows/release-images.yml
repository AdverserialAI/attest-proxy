name: Release images
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  attest-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/adverserialai/attest-proxy:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/adverserialai/attest-proxy
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  gpu-evidence-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collector
          push: true
          platforms: linux/amd64
          tags: ghcr.io/adverserialai/gpu-evidence-collector:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/adverserialai/gpu-evidence-collector
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The deployed CVM must pull release images without carrying a registry
  # credential.  The source, build provenance and SBOM are public evidence,
  # so published release packages are deliberately public too.
  make-release-packages-public:
    needs: [attest-proxy, gpu-evidence-collector]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Publish attest-proxy package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "/orgs/${{ github.repository_owner }}/packages/container/attest-proxy" -f visibility=public
      - name: Publish collector package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "/orgs/${{ github.repository_owner }}/packages/container/gpu-evidence-collector" -f visibility=public
